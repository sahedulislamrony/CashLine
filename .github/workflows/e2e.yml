name: E2E (manual)

# Manual until verified end to end on hosted runners (docs/memory.md O-13).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Maestro smoke test (iOS simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo prebuild --platform ios
      - name: Build release app for simulator (JS bundle embedded)
        run: >
          xcodebuild
          -workspace ios/Cashline.xcworkspace
          -scheme Cashline
          -configuration Release
          -sdk iphonesimulator
          -derivedDataPath ios/build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Boot simulator and install app
        run: |
          xcrun simctl boot "iPhone 17" || xcrun simctl boot "$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          xcrun simctl install booted ios/build/Build/Products/Release-iphonesimulator/Cashline.app
      - run: pnpm test:e2e
