name: Feature request
description: Suggest a change to Cashline.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please read the V1 scope and non-goals in docs/project-specifications.md §3 first.
        Cashline has no accounts, no backend and no network features in V1.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you have tried
